name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "build.gradle.kts" -maxdepth 3 | grep -v "/app/" | head -n 1))
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 1. Create local.properties with SDK path and placeholder API key if missing
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=placeholder_key" >> local.properties

          # 2. Generate debug.keystore if missing (fixes validateSigningDebug)
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Create valid placeholder google-services.json if missing (fixes default_web_client_id)
          if [ ! -f "app/google-services.json" ]; then
            PKG_NAME=$(grep -oE 'applicationId\s*=\s*"[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
            [ -z "$PKG_NAME" ] && PKG_NAME="com.example.snapvote"
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "snapvote-placeholder",
              "storage_bucket": "snapvote-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789000-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForBuildOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "123456789000-placeholder.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 4. Upgrade Gradle wrapper to 9.3.1 (required by AGP 9.1.1)
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

          # 5. Compile the debug APK
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
