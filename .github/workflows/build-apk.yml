name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run Custom Patch Script & Build APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "build.gradle.kts" -maxdepth 3 | grep -v "/app/" | head -n 1))
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 1. Create local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=placeholder_key" >> local.properties

          # 2. Generate debug.keystore if missing and print SHA-1 for Firebase
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== YOUR FIREBASE SHA-1 FINGERPRINT ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"

          # 3. Run your custom patch_login.py file
          if [ -f "patch_login.py" ]; then
            python3 patch_login.py
          fi

          # 4. Upgrade Gradle wrapper to 9.3.1 and compile APK
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
