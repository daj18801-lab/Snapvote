name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "build.gradle.kts" -maxdepth 3 | grep -v "/app/" | head -n 1))
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Create local.properties with SDK path and placeholder API key if missing
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=placeholder_key" >> local.properties

          # Generate or upgrade Gradle wrapper to 9.3.1 (required by AGP 9.1.1)
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

          # Compile the debug APK
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
